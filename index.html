function expandedEvents(from,to){
  const out=[]; const max=1200;
  for(const ev of state.ops.events){
    const repeat=ev.repeat||'none', start=new Date(ev.start), end=new Date(ev.end||ev.start), dur=Math.max(0,end-start);
    if(repeat==='none'||repeat==='provider'||ev.provider==='google'){if(end>=from&&start<=to)out.push(ev);continue}
    let cur=new Date(start), count=0; const until=ev.repeatUntil?new Date(ev.repeatUntil+'T23:59:59'):to;
    while(cur<=to&&cur<=until&&count++<max){const curEnd=new Date(cur.getTime()+dur);if(curEnd>=from)out.push({...ev,start:cur.toISOString(),end:curEnd.toISOString(),occurrenceOf:ev.id});if(repeat==='daily')cur=addDays(cur,1);else if(repeat==='weekly')cur=addDays(cur,7);else if(repeat==='biweekly')cur=addDays(cur,14);else if(repeat==='monthly'){const n=new Date(cur);n.setMonth(n.getMonth()+1);cur=n}else break}

}

function renderTimedEventsForDay(d){const day=dayKey(d);const ev=expandedEvents(startDay(d),addDays(startDay(d),1)).filter(e=>!e.allDay&&dayKey(e.start)===day).sort((a,b)=>new Date(a.start)-new Date(b.start));const items=ev.map(e=>{const s=new Date(e.start),en=new Date(e.end||e.start);const startMin=s.getHours()*60+s.getMinutes(),endMin=Math.max(startMin+20,en.getHours()*60+en.getMinutes());return{...e,startMin,endMin}});const laid=layoutOverlap(items);return laid.map(e=>{const top=((e.startMin-300)/60)*45,height=Math.max(18,((e.endMin-e.startMin)/60)*45);if(top<0||top>900)return'';return `<button class="event-card" data-event="${e.id}" style="--event-color:${e.color||state.theme.accent2};top:${top}px;height:${Math.min(height,900-top)}px;left:calc(${e.leftPct}% + 2px);width:calc(${e.widthPct}% - 4px)"><div class="etitle">${esc(e.title)}</div><div class="etime">${fmtTime(e.start)}–${fmtTime(e.end)}</div></button>`}).join('')}

function movementById(id=state.fitness.activeMovementId){return state.fitness.movements.find(m=>m.id===id)||state.fitness.movements[0]}
function sessionMetrics(s){let volume=0,reps=0,e1=0;s.sets.forEach(x=>{volume+=num(x.weightKg)*num(x.reps);reps+=num(x.reps);e1=Math.max(e1,num(x.weightKg)*(1+num(x.reps)/30))});return{sets:s.sets.length,reps,volume,e1rm:e1}}

function renderFitnessOverview(){const m=movementById(),candles=fitnessCandles(m),last=candles.at(-1),idx=last?last.close:100;const recent=[...state.fitness.sessions].sort((a,b)=>new Date(b.performedAt)-new Date(a.performedAt)).slice(0,5),weekVol=state.fitness.sessions.filter(s=>new Date(s.performedAt)>=addDays(new Date(),-7)).reduce((a,s)=>a+sessionMetrics(s).volume,0);setTimeout(()=>{$$('[data-movement]').forEach(b=>b.onclick=()=>mutate(s=>s.fitness.activeMovementId=b.dataset.movement));$$('[data-session]').forEach(b=>b.onclick=()=>openSessionModal(state.fitness.sessions.find(s=>s.id===b.dataset.session)));bindFitnessControls();},0);return `<div class="cards"><div class="card"><div class="label">FITNESS INDEX</div><div class="value">${idx.toFixed(1)}</div></div><div class="card"><div class="label">7D VOLUME</div><div class="value">${shortMoney(weekVol)} <small>KG</small></div></div><div class="card"><div class="label">SESSIONS</div><div class="value">${state.fitness.sessions.length}</div></div><div class="card"><div class="label">ACTIVE MOVEMENT</div><div class="value">${esc(m.symbol)}</div></div></div><div class="grid fitness-market-grid" style="grid-template-columns:220px minmax(0,1fr) 260px"><section class="panel"><div class="paneltitle">MOVEMENTS</div><div class="stack" style="margin-top:10px">${state.fitness.movements.map(x=>{const c=fitnessCandles(x).at(-1);return `<button class="btn ${x.id===m.id?'primary':''}" data-movement="${x.id}" style="display:flex;justify-content:space-between"><span>${esc(x.symbol)}</span><b>${(c?.close||100).toFixed(1)}</b></button>`}).join('')}</div><button class="btn full" style="margin-top:10px" onclick="state.ui.sub.fitness='movements';save()">+ MOVEMENT</button></section>${renderFitnessChart()}<section class="panel"><div class="paneltitle">MOVEMENT STATUS</div><div style="margin-top:12px"><div class="metric">${esc(m.name)}</div><div class="mono muted">${esc(m.model.toUpperCase())} MODEL</div></div><div class="divider"></div><div class="stack mono"><div class="row between"><span>BASELINE VOL</span><b>${shortMoney(m.baselineVolume)} KG</b></div><div class="row between"><span>BASELINE E1RM</span><b>${num(m.baselineE1rm).toFixed(1)} KG</b></div><div class="row between"><span>SCHEDULE</span><b>${m.scheduledDays.map(d=>['S','M','T','W','T','F','S'][d]).join(' ')||'NONE'}</b></div><div class="row between"><span>BASE DECAY</span><b>${(m.decayBase*100).toFixed(2)}%</b></div></div><button class="btn primary full" style="margin-top:12px" data-action="log-session">LOG SESSION</button></section></div><div class="panel" style="margin-top:var(--gap)"><div class="panelhead"><div class="paneltitle">RECENT SESSIONS</div><button class="btn" onclick="state.ui.sub.fitness='records';save()">VIEW ALL →</button></div>${recent.length?`<div class="tablewrap"><table class="table"><thead><tr><th>DATE</th><th>EXERCISE</th><th>SETS</th><th>REPS</th><th>VOLUME</th><th>E1RM</th></tr></thead><tbody>${recent.map(s=>{const mm=movementById(s.movementId),x=sessionMetrics(s);return `<tr data-session="${s.id}"><td>${fmtDate(s.performedAt,{day:'2-digit',month:'short'})}</td><td>${esc(mm?.name||s.exercise||'Movement')}</td><td>${x.sets}</td><td>${x.reps}</td><td>${shortMoney(x.volume)} KG</td><td>${x.e1rm.toFixed(1)} KG</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">LOG YOUR FIRST SESSION TO START THE EXCHANGE</div>'}</div>`}

function fitnessDailyCandles(m){const sessions=sessionsForMovement(m.id);const start=sessions.length?startDay(new Date(Math.min(new Date(m.createdAt||isoDate()),new Date(sessions[0].performedAt)))):startDay(new Date(m.createdAt||isoDate()));const end=startDay(new Date());const byDay={};sessions.forEach(s=>(byDay[dayKey(s.performedAt)]??=[]).push(s));let close=100,missed=0;const out=[];for(let d=new Date(start);d<=end;d=addDays(d,1)){const key=dayKey(d),dow=d.getDay(),isRest=state.fitness.globalRestDays.includes(dow),scheduled=m.scheduledDays.includes(dow),ss=byDay[key]||[],open=close;let high=open,low=open,volume=0,stateName='closed';if(isRest){stateName='closed'}else if(ss.length&&scheduled){const mets=ss.map(sessionMetrics);volume=mets.reduce((s,x)=>s+x.volume,0);const best=Math.max(...mets.map(x=>x.e1rm));const vr=m.baselineVolume?volume/m.baselineVolume:1, sr=m.baselineE1rm?best/m.baselineE1rm:1;let stimulus=m.model==='volume'?.85*vr+.15*sr:m.model==='strength'?.25*vr+.75*sr:.58*vr+.42*sr;const gain=clamp(.002+(stimulus-0.7)*.025,.002,.055);close=open*(1+gain);high=Math.max(open,close)*(1+.0025);low=Math.min(open,close)*(1-.0015);missed=0;stateName='session'}else if(scheduled){const rate=Math.min(m.decayMax,m.decayBase+m.decayAcceleration*missed);close=open*(1-rate);high=open;low=close*(1-.001);missed++;stateName='missed'}else{stateName='closed'}out.push({time:key,open,high,low,close,volume,state:stateName})}return out}
function aggregateCandles(daily,int){if(int==='D')return daily;const groups=new Map();daily.forEach(c=>{const d=new Date(c.time+'T00:00:00');let key;if(int==='W'){const sw=startWeek(d);key=isoDate(sw)}else key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(c)});return [...groups.entries()].map(([time,a])=>({time,open:a[0].open,high:Math.max(...a.map(x=>x.high)),low:Math.min(...a.map(x=>x.low)),close:a.at(-1).close,volume:a.reduce((s,x)=>s+x.volume,0),state:a.some(x=>x.state==='session')?'session':a.some(x=>x.state==='missed')?'missed':'closed'}))}
function rangeStart(range){const n=new Date();if(range==='1M')return addDays(n,-31);if(range==='3M')return addDays(n,-93);if(range==='6M')return addDays(n,-186);if(range==='1Y')return addDays(n,-366);if(range==='1W')return addDays(n,-8);return new Date(0)}

function renderFitnessRecords(){const rows=[...state.fitness.sessions].sort((a,b)=>new Date(b.performedAt)-new Date(a.performedAt)),size=25,pages=Math.max(1,Math.ceil(rows.length/size)),p=clamp(state.ui.fitnessPage,1,pages),slice=rows.slice((p-1)*size,p*size);setTimeout(()=>{$$('[data-session]').forEach(b=>b.onclick=()=>openSessionModal(state.fitness.sessions.find(s=>s.id===b.dataset.session)));$('#fitPrev')&&($('#fitPrev').onclick=()=>mutate(s=>s.ui.fitnessPage=Math.max(1,p-1)));$('#fitNext')&&($('#fitNext').onclick=()=>mutate(s=>s.ui.fitnessPage=Math.min(pages,p+1)));},0);return `<section class="panel"><div class="panelhead"><div><div class="kicker">TRAINING // ARCHIVE</div><div class="paneltitle">FITNESS RECORDS</div></div><button class="btn primary" data-action="log-session">LOG SESSION</button></div>${slice.length?`<div class="tablewrap"><table class="table"><thead><tr><th>DATE</th><th>EXERCISE</th><th>TYPE</th><th>BODY WT</th><th>SETS</th><th>REPS</th><th>VOLUME</th><th>E1RM</th></tr></thead><tbody>${slice.map(s=>{const m=movementById(s.movementId),x=sessionMetrics(s);return `<tr data-session="${s.id}"><td>${fmtDate(s.performedAt,{day:'2-digit',month:'short',year:'numeric'})}</td><td>${esc(m?.name||s.exercise||'—')}</td><td>${esc(s.exerciseType||m?.exerciseType||'—')}</td><td>${s.bodyWeightKg?num(s.bodyWeightKg).toFixed(1)+' KG':'—'}</td><td>${x.sets}</td><td>${x.reps}</td><td>${shortMoney(x.volume)} KG</td><td>${x.e1rm.toFixed(1)} KG</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">NO TRAINING RECORDS</div>'}<div class="pager"><span>${rows.length?`${(p-1)*size+1}–${Math.min(p*size,rows.length)} OF ${rows.length}`:'0 RECORDS'}</span><span><button class="btn" id="fitPrev" ${p<=1?'disabled':''}>PREVIOUS</button> &nbsp; PAGE ${p}/${pages} &nbsp; <button class="btn" id="fitNext" ${p>=pages?'disabled':''}>NEXT</button></span></div></section>`}

 COMPLETION</label><div class="field wide"><label>NOTES</label><textarea class="textarea" name="notes">${esc(x.notes||'')}</textarea></div><div class="wide row between"><div>${ev?'<button type="button" class="btn danger" id="deleteEvent">DELETE</button>':''}</div><div class="row"><button type="button" class="btn" id="duplicateEvent">DUPLICATE</button><button class="btn primary" type="submit">SAVE</button></div></div></form>`);wireClose();$('#eventForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(x,{title:f.get('title').trim(),category:f.get('category').trim(),color:f.get('color'),start:new Date(f.get('start')).toISOString(),end:new Date(f.get('end')).toISOString(),location:f.get('location').trim(),reminder:f.get('reminder'),repeat:f.get('repeat'),repeatUntil:f.get('repeatUntil'),allDay:f.get('allDay')==='on',trackCompletion:f.get('trackCompletion')==='on',notes:f.get('notes'),updatedAt:new Date().toISOString()});if(new Date(x.end)<new Date(x.start))return toast('End must be after start','warn');upsert('events',x);closeModal();toast('Event saved','success');await syncRecord('event',x)};$('#duplicateEvent').onclick=()=>{const cp={...x,id:uid('evt'),title:(x.title||'Event')+' copy',provider:'local',providerEventId:null,syncStatus:'local',createdAt:new Date().toISOString()};state.ops.events.push(cp);save();closeModal();toast('Event duplicated','success')};if(ev)$('#deleteEvent').onclick=()=>{if(confirm('Delete this event?')){state.ops.events=state.ops.events.filter(e=>e.id!==x.id);save();closeModal();toast('Event deleted');syncDelete('event',x)}}}

function openSessionModal(session=null){
  const defaultMove=movementById();
  const x=session?structuredClone(session):{id:uid('fit'),movementId:defaultMove?.id||'',performedAt:localDT(),exerciseType:defaultMove?.exerciseType||'Barbell',bodyWeightKg:'',sets:[{weightKg:'',reps:'',rpe:''}],notes:'',createdAt:new Date().toISOString()};
  const setRows=()=>x.sets.map((s,i)=>`<div class="row setrow" data-set="${i}" style="display:grid;grid-template-columns:36px 1fr 56px 1fr 56px 1fr 56px auto;gap:6px;align-items:center"><span class="mono">${i+1}</span><input class="input" type="number" step="0.1" data-set-field="weightKg" value="${esc(s.weightKg)}"><span class="mono muted">KG ×</span><input class="input" type="number" step="1" data-set-field="reps" value="${esc(s.reps)}"><span class="mono muted">RPE</span><input class="input" type="number" min="1" max="10" step="0.5" data-set-field="rpe" value="${esc(s.rpe)}"><span></span><button type="button" class="btn danger" data-remove-set="${i}">×</button></div>`).join('');
  const draw=()=>{modal(`${modalHead(session?'EDIT SESSION':'LOG SESSION')}
    <form id="sessionForm" class="formgrid">
      <div class="field"><label>DATE / TIME</label><input class="input" type="datetime-local" name="performedAt" value="${esc(localDT(new Date(x.performedAt)))}"></div>
      <div class="field"><label>MOVEMENT / EXERCISE</label><select class="select" name="movementId">${state.fitness.movements.map(m=>`<option value="${m.id}" ${x.movementId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
      <div class="field"><label>EXERCISE TYPE</label><input class="input" name="exerciseType" value="${esc(x.exerciseType||'')}"></div>
      <div class="field"><label>BODY WEIGHT KG</label><input class="input" type="number" step="0.1" name="bodyWeightKg" value="${esc(x.bodyWeightKg)}"></div>
      <div class="field wide"><label>SETS</label><div id="setRows" class="stack">${setRows()}</div><button type="button" class="btn" id="addSet" style="margin-top:8px">+ SET</button></div>
      <div class="wide grid four" id="sessionPreview"></div>
      <div class="field wide"><label>NOTES</label><textarea class="textarea" name="notes">${esc(x.notes||'')}</textarea></div>
      <div class="wide row between"><div>${session?'<button type="button" class="btn danger" id="deleteSession">DELETE</button>':''}</div><button class="btn primary" type="submit">SAVE SESSION</button></div>
    </form>`);wireClose();bindSessionModal();};
  function readSets(){x.sets=$$('.setrow').map(r=>({weightKg:num($('[data-set-field=weightKg]',r)?.value),reps:num($('[data-set-field=reps]',r)?.value),rpe:num($('[data-set-field=rpe]',r)?.value)})).filter(s=>s.weightKg>0&&s.reps>0)}
  function preview(){readSets();const mt=sessionMetrics(x),r=$('#sessionPreview');if(r)r.innerHTML=`<div class="card"><div class="label">SETS</div><div class="value">${mt.sets}</div></div><div class="card"><div class="label">REPS</div><div class="value">${mt.reps}</div></div><div class="card"><div class="label">VOLUME</div><div class="value">${shortMoney(mt.volume)}</div></div><div class="card"><div class="label">EST E1RM</div><div class="value">${mt.e1rm.toFixed(1)}</div></div>`}
  function bindSessionModal(){
    $('#addSet').onclick=()=>{readSets();x.sets.push({weightKg:'',reps:'',rpe:''});draw()};
    $$('[data-remove-set]').forEach(b=>b.onclick=()=>{readSets();x.sets.splice(+b.dataset.removeSet,1);if(!x.sets.length)x.sets=[{weightKg:'',reps:'',rpe:''}];draw()});
    $$('.setrow input').forEach(i=>i.oninput=preview);preview();
    $('#sessionForm').onsubmit=async e=>{e.preventDefault();readSets();if(!x.sets.length)return toast('Add at least one valid set','warn');const f=new FormData(e.target);Object.assign(x,{movementId:f.get('movementId'),performedAt:new Date(f.get('performedAt')).toISOString(),exerciseType:f.get('exerciseType').trim(),bodyWeightKg:f.get('bodyWeightKg')?num(f.get('bodyWeightKg')):null,notes:f.get('notes'),updatedAt:new Date().toISOString()});const i=state.fitness.sessions.findIndex(s=>s.id===x.id);if(i>=0)state.fitness.sessions[i]=x;else state.fitness.sessions.push(x);state.fitness.activeMovementId=x.movementId;save();closeModal();toast('Training session saved','success');await syncRecord('fitness-session',x)};

  }
  draw();
}
function upsert(key,obj){const arr=state.ops[key],i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);save()}
function upsertFinance(key,obj){const arr=state.finance[key],i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);save()}
/* ========================= CHARTS ========================= */
function renderCharts(){const f=$('#fitnessChart');if(f)drawFitnessChart(f);const c=$('#cashChart');if(c)drawCashChart(c)}
function canvasSetup(canvas){const dpr=Math.min(2,window.devicePixelRatio||1),rect=canvas.getBoundingClientRect();canvas.width=Math.max(10,rect.width*dpr);canvas.height=Math.max(10,rect.height*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w:rect.width,h:rect.height}}
function cssColor(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawAxes(ctx,w,h,min,max,gridColor,labels){const left=48,right=12,top=14,bottom=92,plotH=h-top-bottom,plotW=w-left-right;ctx.strokeStyle=gridColor;ctx.fillStyle=cssColor('--muted');ctx.font='9px '+state.theme.dataFont;ctx.textAlign='right';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=top+i*plotH/4,v=max-(max-min)*i/4;ctx.globalAlpha=.45;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.globalAlpha=1;ctx.fillText(v.toFixed(max-min<10?1:0),left-5,y)}return{left,right,top,bottom,plotH,plotW}}
function dateLabel(s){const d=new Date(s+'T00:00:00');return new Intl.DateTimeFormat('en-SG',{day:'2-digit',month:'short'}).format(d)}
function drawFitnessChart(canvas){const m=movementById();if(!m)return;const data=fitnessCandles(m),{ctx,w,h}=canvasSetup(canvas),c=state.fitness.chart;ctx.clearRect(0,0,w,h);if(!data.length){ctx.fillStyle=cssColor('--muted');ctx.font='11px '+state.theme.dataFont;ctx.fillText('NO INDEX DATA',20,30);return}let min=Math.min(...data.map(x=>x.low)),max=Math.max(...data.map(x=>x.high));if(min===max){min-=1;max+=1}const span=max-min,volMax=Math.max(1,...data.map(x=>x.volume));const ax=drawAxes(ctx,w,h,min-span*.08,max+span*.08,c.grid);const n=data.length,bw=Math.max(2,ax.plotW/n*.62),step=ax.plotW/n,y=v=>ax.top+(max+span*.08-v)/(span+span*.16)*ax.plotH;data.forEach((d,i)=>{const x=ax.left+(i+.5)*step,color=d.state==='closed'?c.closed:d.close>d.open?c.bull:d.close<d.open?c.bear:c.neutral;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.globalAlpha=d.state==='closed'?.5:1;ctx.beginPath();ctx.moveTo(x,y(d.high));ctx.lineTo(x,y(d.low));ctx.stroke();const y1=y(d.open),y2=y(d.close),top=Math.min(y1,y2),hh=Math.max(1,Math.abs(y2-y1));ctx.fillRect(x-bw/2,top,bw,hh);ctx.globalAlpha=1;const vh=48*(d.volume/volMax);ctx.fillStyle=c.volume;ctx.globalAlpha=.7;ctx.fillRect(x-bw/2,h-63-vh,bw,vh);ctx.globalAlpha=1});const labelCount=Math.min(6,data.length);ctx.fillStyle=cssColor('--muted');ctx.font='9px '+state.theme.dataFont;ctx.textAlign='center';for(let j=0;j<labelCount;j++){const i=Math.round(j*(data.length-1)/Math.max(1,labelCount-1)),x=ax.left+(i+.5)*step;ctx.fillText(dateLabel(data[i].time),x,h-10)}ctx.textAlign='left';ctx.fillText('VOLUME KG',ax.left,h-67)}
function cashDailyCandles(){const tx=[...state.finance.transactions].sort((a,b)=>new Date(a.occurredAt)-new Date(b.occurredAt));if(!tx.length)return[];const first=startDay(new Date(tx[0].occurredAt)),end=startDay(new Date()),by={};tx.forEach(t=>(by[dayKey(t.occurredAt)]??=[]).push(t));let bal=0;const out=[];for(let d=new Date(first);d<=end;d=addDays(d,1)){const arr=(by[dayKey(d)]||[]).sort((a,b)=>new Date(a.occurredAt)-new Date(b.occurredAt)),open=bal;let high=bal,low=bal,vin=0,vout=0;for(const t of arr){const a=num(t.amount);if(t.direction==='inflow'){bal+=a;vin+=a}else{bal-=a;vout+=a}high=Math.max(high,bal);low=Math.min(low,bal)}out.push({time:dayKey(d),open,high,low,close:bal,volumeIn:vin,volumeOut:vout})}return out}
function aggregateCash(daily,int){if(int==='D')return daily;const g=new Map();daily.forEach(c=>{const d=new Date(c.time+'T00:00:00'),key=int==='W'?isoDate(startWeek(d)):`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;if(!g.has(key))g.set(key,[]);g.get(key).push(c)});return [...g.entries()].map(([time,a])=>({time,open:a[0].open,high:Math.max(...a.map(x=>x.high)),low:Math.min(...a.map(x=>x.low)),close:a.at(-1).close,volumeIn:a.reduce((s,x)=>s+x.volumeIn,0),volumeOut:a.reduce((s,x)=>s+x.volumeOut,0)}))}
function cashCandles(){const c=state.finance.cashChart,all=aggregateCash(cashDailyCandles(),c.interval);if(c.range==='ALL')return all;return all.filter(x=>new Date(x.time)>=rangeStart(c.range))}
function drawCashChart(canvas){const data=cashCandles(),{ctx,w,h}=canvasSetup(canvas),c=state.finance.cashChart;ctx.clearRect(0,0,w,h);if(!data.length){ctx.fillStyle=cssColor('--muted');ctx.font='11px '+state.theme.dataFont;ctx.fillText('ADD AN INFLOW OR EXPENSE TO START CASHFLOW',20,30);return}let min=Math.min(...data.map(x=>x.low)),max=Math.max(...data.map(x=>x.high));if(min===max){min-=1;max+=1}const pad=(max-min)*.08,ax=drawAxes(ctx,w,h,min-pad,max+pad,c.grid),n=data.length,bw=Math.max(2,ax.plotW/n*.62),step=ax.plotW/n,y=v=>ax.top+(max+pad-v)/(max-min+2*pad)*ax.plotH,volMax=Math.max(1,...data.map(x=>x.volumeIn+x.volumeOut));data.forEach((d,i)=>{const x=ax.left+(i+.5)*step,color=d.close>d.open?c.bull:d.close<d.open?c.bear:c.neutral;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y(d.high));ctx.lineTo(x,y(d.low));ctx.stroke();const y1=y(d.open),y2=y(d.close);ctx.fillRect(x-bw/2,Math.min(y1,y2),bw,Math.max(1,Math.abs(y2-y1)));const base=h-63,vin=44*d.volumeIn/volMax,vout=44*d.volumeOut/volMax;ctx.fillStyle=c.volumeIn;ctx.globalAlpha=.75;ctx.fillRect(x-bw/2,base-vin,bw/2,vin);ctx.fillStyle=c.volumeOut;ctx.fillRect(x,base-vout,bw/2,vout);ctx.globalAlpha=1});const lc=Math.min(6,data.length);ctx.fillStyle=cssColor('--muted');ctx.font='9px '+state.theme.dataFont;ctx.textAlign='center';for(let j=0;j<lc;j++){const i=Math.round(j*(data.length-1)/Math.max(1,lc-1)),x=ax.left+(i+.5)*step;ctx.fillText(dateLabel(data[i].time),x,h-10)}}

/* ========================= AI ========================= */
function buildAISnapshot(){const now=new Date(),week=addDays(now,7),events=state.ops.events.filter(e=>new Date(e.start)>=startDay(now)&&new Date(e.start)<=week),tasks=state.ops.tasks.filter(t=>t.status!=='completed'&&t.status!=='archived'),overdue=tasks.filter(t=>t.dueAt&&new Date(t.dueAt)<now),balance=financeBalance(),net30=financeNet(30),fit=state.fitness.movements.map(m=>({movement:m.symbol,index:fitnessCandles(m).at(-1)?.close||100,sessions30:sessionsForMovement(m.id).filter(s=>new Date(s.performedAt)>=addDays(now,-30)).length}));const snap={generatedAt:new Date().toISOString(),events:events.length,tasks:tasks.length,overdue:overdue.length,balance,net30,fitness:fit};if(state.ai.privacy.eventTitles)snap.eventTitles=events.map(e=>e.title);if(state.ai.privacy.tasks)snap.taskTitles=tasks.map(t=>t.title);if(state.ai.privacy.journal)snap.journal=state.finance.journal;if(state.ai.privacy.positions)snap.positions=state.finance.positions;return snap}
function localAIOverview(scope='daily'){const s=buildAISnapshot(),fitAvg=s.fitness.length?s.fitness.reduce((a,x)=>a+x.index,0)/s.fitness.length:100,workload=clamp(40+s.events*4+s.tasks*3+s.overdue*8,0,100),ops=clamp(92-s.overdue*9-Math.max(0,s.events-8)*3,0,100),finance=clamp(65+(s.net30>=0?12:-12)+(s.balance>0?8:-10),0,100),fitness=clamp(50+(fitAvg-100)*2.5,0,100),discipline=clamp(88-s.overdue*10,0,100),severity=s.overdue>=3||workload>90||s.balance<0?'critical':s.overdue||workload>75||s.net30<0?'warning':'normal';const headline=severity==='critical'?'High-priority system attention required':severity==='warning'?'Elevated operational load':'Systems operating within normal parameters';const insights=[`${s.events} operations are scheduled in the next seven days.`,`${s.tasks} objectives remain active${s.overdue?`, including ${s.overdue} overdue`:''}.`,`30-day cashflow is ${s.net30>=0?'positive':'negative'} at ${money(s.net30)}.`,`Average movement index is ${fitAvg.toFixed(1)}.`];const actions=[];if(s.overdue)actions.push(`Clear ${s.overdue} overdue objective${s.overdue>1?'s':''}.`);if(s.net30<0)actions.push('Review current outflow categories and cashflow trend.');if(fitAvg<100)actions.push('Review missed scheduled training opportunities.');if(!actions.length)actions.push('Maintain current operating rhythm.');return{generatedAt:new Date().toISOString(),scope,severity,headline,summary:insights.slice(0,2).join(' '),insights,actions,scores:{operations:Math.round(ops),workload:Math.round(workload),discipline:Math.round(discipline),finance:Math.round(finance),fitness:Math.round(fitness)}}}
async function generateAI(scope='daily'){setAvatar('analyzing','Compiling operational, financial and fitness data...');toast('Generating intelligence overview');let result;try{if(state.integrations.apiBase&&state.integrations.gemini.status==='ready'){result=await api('/api/v7/ai/overview',{method:'POST',body:{scope,snapshot:buildAISnapshot(),privacy:state.ai.privacy}})}else result=localAIOverview(scope)}catch(e){console.error(e);result=localAIOverview(scope);toast('Gemini unavailable — local intelligence used','warn')}state.ai.latest=result;state.ai.history.unshift(result);state.ai.history=state.ai.history.slice(0,100);state.avatar.state=result.severity==='critical'?'critical':result.severity==='warning'?'warning':'success';state.avatar.dialog=result.headline;save();toast('AI Overview complete','success')}
let settingsSyncTimer=null;
function settingsPayload(){return{identity:state.identity,theme:state.theme,avatar:state.avatar,aiPrivacy:state.ai.privacy,fitnessChart:state.fitness.chart,fitnessGlobalRestDays:state.fitness.globalRestDays,cashChart:state.finance.cashChart}}
function scheduleSettingsSync(){if(!state.integrations.apiBase||!localStorage.getItem(SESSION_KEY))return;clearTimeout(settingsSyncTimer);settingsSyncTimer=setTimeout(()=>api('/api/v7/settings',{method:'PUT',body:{settings:settingsPayload()}}).catch(()=>{}),900)}
function mergeById(local,remote){const m=new Map((local||[]).map(x=>[x.id,x]));for(const x of remote||[])m.set(x.id,{...(m.get(x.id)||{}),...x});return [...m.values()]}
function applyRemoteSettings(x){if(!x)return;if(x.identity)state.identity=deepMerge(state.identity,x.identity);if(x.theme)state.theme=deepMerge(state.theme,x.theme);if(x.avatar)state.avatar=deepMerge(state.avatar,x.avatar);if(x.aiPrivacy)state.ai.privacy=deepMerge(state.ai.privacy,x.aiPrivacy);if(x.fitnessChart)state.fitness.chart=deepMerge(state.fitness.chart,x.fitnessChart);if(Array.isArray(x.fitnessGlobalRestDays))state.fitness.globalRestDays=x.fitnessGlobalRestDays;if(x.cashChart)state.finance.cashChart=deepMerge(state.finance.cashChart,x.cashChart)}
async function hydrateBackend(){if(!state.integrations.apiBase||!localStorage.getItem(SESSION_KEY))return;try{const [b,st]=await Promise.all([api('/api/v7/bootstrap'),api('/api/v7/integrations/status')]);state.ops.events=mergeById(state.ops.events,b.events);state.ops.tasks=mergeById(state.ops.tasks,b.tasks);state.finance.transactions=mergeById(state.finance.transactions,b.finance?.transactions);state.finance.positions=mergeById(state.finance.positions,b.finance?.positions);if(typeof b.finance?.journal==='string'&&b.finance.journal)state.finance.journal=b.finance.journal;state.fitness.sessions=mergeById(state.fitness.sessions,b.fitness?.sessions);if(b.fitness?.movements?.length)state.fitness.movements=mergeById(state.fitness.movements,b.fitness.movements);applyRemoteSettings(b.settings);Object.assign(state.integrations,{...state.integrations,...st,apiBase:state.integrations.apiBase});localStorage.setItem(STORE_KEY,JSON.stringify(state));applyTheme();renderApp();await pushLocalRecords()}catch(e){console.warn('hydrateBackend',e)}}
async function pushLocalRecords(){for(const m of state.fitness.movements)await syncRecord('movement',m);for(const e of state.ops.events.filter(x=>x.provider!=='google'))await syncRecord('event',e);for(const t of state.ops.tasks.filter(x=>x.provider!=='google'))await syncRecord('task',t);for(const x of state.finance.transactions)await syncRecord('transaction',x);for(const p of state.finance.positions)await syncRecord('position',p);for(const f of state.fitness.sessions)await syncRecord('fitness-session',f);scheduleSettingsSync()}
/* ========================= API / PROVIDERS ========================= */
async function api(path,{method='GET',body,headers={}}={}){const base=state.integrations.apiBase;if(!base)throw new Error('V7 API base is not configured');const token=localStorage.getItem(SESSION_KEY);const r=await fetch(base+path,{method,credentials:'include',headers:{'Content-Type':'application/json',...(token?{'X-Neon-Session':token}:{}),...headers},body:body!==undefined?JSON.stringify(body):undefined});const text=await r.text();let data;try{data=text?JSON.parse(text):{}}catch{data={raw:text}}if(!r.ok)throw new Error(data.error||data.message||`HTTP ${r.status}`);return data}
async function healthCheck(){try{const d=await api('/health');toast(`Backend online ${d.version||''}`,'success')}catch(e){toast(e.message,'error')}}
function integrationConnect(name){const base=state.integrations.apiBase;if(!base)return toast('Set the V7 API base first','warn');const ret=location.href.split('#')[0];location.href=`${base}/auth/${name}?returnTo=${encodeURIComponent(ret)}`}
async function syncRecord(type,obj){if(!state.integrations.apiBase)return null;const map={event:'/api/v7/events',task:'/api/v7/tasks',transaction:'/api/v7/finance/transactions',position:'/api/v7/finance/positions','fitness-session':'/api/v7/fitness/sessions',movement:'/api/v7/fitness/movements'};if(!map[type])return null;try{const d=await api(`${map[type]}/${encodeURIComponent(obj.id)}`,{method:'PUT',body:obj});if(type==='event'){const i=state.ops.events.findIndex(x=>x.id===obj.id);if(i>=0)state.ops.events[i]={...state.ops.events[i],...d}}else if(type==='task'){const i=state.ops.tasks.findIndex(x=>x.id===obj.id);if(i>=0)state.ops.tasks[i]={...state.ops.tasks[i],...d}}localStorage.setItem(STORE_KEY,JSON.stringify(state));return d}catch(e){console.warn('syncRecord',type,e);toast(`${type} saved locally; backend sync pending`,'warn');return null}}
async function syncDelete(type,obj){if(!state.integrations.apiBase)return;const map={event:'/api/v7/events',task:'/api/v7/tasks',transaction:'/api/v7/finance/transactions',position:'/api/v7/finance/positions','fitness-session':'/api/v7/fitness/sessions',movement:'/api/v7/fitness/movements'};try{await api(`${map[type]}/${encodeURIComponent(obj.id)}`,{method:'DELETE'})}catch(e){console.warn('syncDelete',e)}}
async function syncGoogle(){if(!state.integrations.apiBase)return toast('Set the V7 API base first','warn');setAvatar('syncing','Synchronizing Google Calendar and Tasks...');state.integrations.google.status='syncing';save();try{const d=await api('/api/v7/google/sync',{method:'POST',body:{calendar:true,tasks:true}});if(Array.isArray(d.events)){const google=d.events.map(e=>({...e,provider:'google',syncStatus:'synced'})),ids=new Set(google.map(e=>e.id));const keep=state.ops.events.filter(e=>e.provider!=='google'||ids.has(e.id));state.ops.events=mergeById(keep,google)}if(Array.isArray(d.tasks)){const google=d.tasks.map(t=>({...t,provider:'google',syncStatus:'synced'})),ids=new Set(google.map(t=>t.id));const keep=state.ops.tasks.filter(t=>t.provider!=='google'||ids.has(t.id));state.ops.tasks=mergeById(keep,google)}state.integrations.google={...state.integrations.google,status:'connected',email:d.email||state.integrations.google.email,lastSync:new Date().toISOString()};state.avatar.state='success';state.avatar.dialog='Google synchronization complete.';save();toast('Google synchronized','success')}catch(e){state.integrations.google.status='error';state.avatar.state='warning';state.avatar.dialog='Google synchronization failed.';save();toast(e.message,'error')}}
async function refreshSpotify(){if(state.integrations.spotify.status!=='connected')return;try{const [now,recent,playlists,devices]=await Promise.all([api('/api/v7/spotify/current'),api('/api/v7/spotify/recent?limit=25'),api('/api/v7/spotify/playlists?limit=25'),api('/api/v7/spotify/devices')]);state.media.spotify.now=now.item||null;state.media.spotify.isPlaying=!!now.isPlaying;state.media.spotify.recent=recent.items||[];state.media.spotify.playlists=playlists.items||[];state.media.spotify.devices=devices.items||[];localStorage.setItem(STORE_KEY,JSON.stringify(state));renderApp()}catch(e){toast(e.message,'error')}}
async function spotifyControl(action,value){try{const map={previous:['POST','/api/v7/spotify/previous'],next:['POST','/api/v7/spotify/next'],toggle:['POST',state.media.spotify.isPlaying?'/api/v7/spotify/pause':'/api/v7/spotify/play'],volume:['PUT','/api/v7/spotify/volume'],seek:['PUT','/api/v7/spotify/seek'],device:['PUT','/api/v7/spotify/device']};const [method,path]=map[action];const body=action==='volume'?{volume:value}:action==='seek'?{positionMs:value}:action==='device'?{deviceId:value}:undefined;await api(path,{method,body});if(action==='volume')state.media.spotify.volume=value;if(action==='seek'&&state.media.spotify.now)state.media.spotify.now.progressMs=value;if(action==='toggle')state.media.spotify.isPlaying=!state.media.spotify.isPlaying;save();setTimeout(refreshSpotify,500)}catch(e){toast(e.message,'error')}}

async function marketRefresh(){if(!state.finance.positions.length)return toast('Add a portfolio position first','warn');try{const syms=state.finance.positions.map(p=>p.symbol).join(',');const d=await api('/api/v7/market/quotes?symbols='+encodeURIComponent(syms));const quotes=d.items||d.quotes||[];for(const q of quotes){const p=state.finance.positions.find(x=>x.symbol===q.symbol);if(p)p.current=num(q.price||q.close,p.current)}state.integrations.market.status='ready';state.integrations.market.lastRefresh=new Date().toISOString();save();toast('Market prices refreshed','success')}catch(e){toast(e.message,'error')}}

function openCommand(searchMode=false){const items=[['Create event',()=>openEventModal()],['Create objective',()=>openTaskModal()],['Log fitness session',()=>openSessionModal()],['Add transaction',()=>openTransactionModal()],['Generate AI Overview',()=>generateAI('daily')],['Open OPS',()=>goPage('ops')],['Open Finance',()=>goPage('finance')],['Open Media',()=>goPage('media')],['Open Fitness',()=>goPage('fitness')],['Open Customize',()=>goPage('customize')]];$('#commandRoot').innerHTML=`<div class="command"><div class="commandbox"><input id="commandInput" placeholder="${searchMode?'Search commands and records...':'Type a command...'}"><div class="commanditems" id="commandItems"></div></div></div>`;const input=$('#commandInput'),list=$('#commandItems');const render=q=>{q=q.toLowerCase();const rec=[];items.filter(([n])=>n.toLowerCase().includes(q)).forEach(([n],fn)=>rec.push({label:n,fn}));if(q){state.ops.events.filter(e=>e.title.toLowerCase().includes(q)).slice(0,8).forEach(e=>rec.push({label:`EVENT · ${e.title}`,fn:()=>openEventModal(e)}));state.ops.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,8).forEach(t=>rec.push({label:`TASK · ${t.title}`,fn:()=>openTaskModal(t)}));state.fitness.movements.filter(m=>m.name.toLowerCase().includes(q)).forEach(m=>rec.push({label:`FITNESS · ${m.name}`,fn:()=>{state.fitness.activeMovementId=m.id;goPage('fitness')}}))}list.innerHTML=rec.map((r,i)=>`<div class="commanditem" data-cmd="${i}">${esc(r.label)}</div>`).join('');$$('[data-cmd]',list).forEach(b=>b.onclick=()=>{closeCommand();rec[+b.dataset.cmd].fn()})};render('');input.oninput=()=>render(input.value);input.focus();$('.command').onclick=e=>{if(e.target.classList.contains('command'))closeCommand()}}
function closeCommand(){$('#commandRoot').innerHTML=''}
function goPage(p){state.ui.page=p;save();closeCommand()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`neon-ops-v7-${isoDate()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.version!==7)throw new Error('Not a V7 export');state=deepMerge(DEFAULT(),d);save();toast('V7 data imported','success')}catch(err){toast(err.message,'error')}};r.readAsText(f)}
function resetData(){if(!confirm('Reset all V7 local data? V5/V6 remain untouched.'))return;state=DEFAULT();localStorage.removeItem(STORE_KEY);save();toast('V7 reset complete')}
/* OAuth session from hash, never query */
function consumeAuthHash(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const session=h.get('neon_session');const provider=h.get('provider');if(session){localStorage.setItem(SESSION_KEY,session);history.replaceState(null,'',location.pathname+location.search);if(provider==='google')state.integrations.google.status='connected';if(provider==='spotify')state.integrations.spotify.status='connected';localStorage.setItem(STORE_KEY,JSON.stringify(state));toast(`${provider||'Provider'} connected`,'success');return provider}return null}
function updateClock(){const el=$('#clock');if(el)el.textContent=new Intl.DateTimeFormat('en-SG',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
setInterval(updateClock,1000);
document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}else if(e.key==='Escape'){closeModal();closeCommand()}else if(!['INPUT','TEXTAREA','SELECT'].includes(tag)){if(e.key.toLowerCase()==='n')openEventModal();if(e.key.toLowerCase()==='t')openTaskModal();if(e.key.toLowerCase()==='f')openSessionModal();if(e.key==='/'){e.preventDefault();openCommand(true)}}});
on('state:saved',()=>{});
const authProvider=consumeAuthHash();renderApp();setTimeout(async()=>{await hydrateBackend();if(authProvider==='google')syncGoogle();if(authProvider==='spotify')refreshSpotify()},250);
setInterval(()=>{if(state.ui.page==='media'&&state.integrations.spotify.status==='connected')refreshSpotify()},30000);
})();
